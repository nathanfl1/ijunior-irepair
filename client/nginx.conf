server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Otimização para envio de payloads (útil para cadastros grandes)
    client_max_body_size 10M;

    # API - Autenticação
    location /auth/ {
        proxy_pass http://api:3000/auth/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API - Clientes
    location /clients {
        proxy_pass http://api:3000/clients;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API - Ordens de Serviço
    location /service-orders {
        proxy_pass http://api:3000/service-orders;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router (Frontend SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}